# Streamlit settings for the viewer (app.py). Never put secrets in this file.

# No [server] address or port on purpose: Streamlit Community Cloud health-checks the hosted
# demo (streamlit_app.py) on localhost:8501 and proxies visitors to it, so this file must pin
# neither. The private view still never reaches the network: app.py refuses private scope
# unless the server address is a loopback address, so its command must include
# --server.address localhost (uv run streamlit run app.py --server.address localhost -- --scope
# private).

[browser]
gatherUsageStats = false

[runner]
# Never render stray expressions: only explicit st.* calls may put content on the page.
magicEnabled = false

[client]
toolbarMode = "minimal"

# One accent per mode, so the viewer follows the visitor's light or dark system setting (a
# single [theme] colour would pin a light custom theme). The "At a glance" charts pick their
# light or dark tokens from st.context.theme.type.
[theme.light]
primaryColor = "#2E7D32"

[theme.dark]
primaryColor = "#66BB6A"
