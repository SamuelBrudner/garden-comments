[project]
name = "crop-explorer"
version = "0.1.0"
description = "Growing-environment-first explorer of gardeners' firsthand variety reports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.2",
    "pandas>=2.2",
    "plotly>=5.24",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "playwright>=1.48",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crop_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "browser: drives the running viewer in headless Chromium with Playwright (deselect with -m 'not browser')",
]

[tool.coverage.run]
source = ["crop_explorer"]

[tool.ruff]
line-length = 99
target-version = "py312"
src = ["src", "tests"]
# SPEC.md is the externally supplied product spec, kept verbatim: its illustrative code
# block must not be rewritten by the formatter.
extend-exclude = ["SPEC.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "RUF", "D", "PL", "C90", "N"]
ignore = ["D203", "D213", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-statements = 15
max-branches = 8
max-args = 6

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR0915", "PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "app.py"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true
